<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f5f5f7'><link rel='manifest' href='manifest.json'><link rel='stylesheet' href='style.css'><title>Mein Haushaltsbuch</title></head><body><main><header><div><small>MEIN HAUSHALTSBUCH</small><h1 id='monthTitle'></h1></div><button id='settingsBtn' class='icon'>⚙︎</button></header><section class='balance card'><span>Noch verfügbar</span><strong id='available'>€ 0,00</strong><div class='stats'><div><small>Einnahmen</small><b id='income'>€ 0,00</b></div><div><small>Ausgaben</small><b id='expense'>€ 0,00</b></div></div></section><section class='card'><div class='sectionHead'><h2>Buchungen</h2><button id='addBtn'>＋ Neu</button></div><div id='txList' class='list'></div></section><section class='card'><div class='sectionHead'><h2>Fixkosten</h2><button id='addRecurringBtn'>＋ Anlegen</button></div><div id='recurringList' class='list'></div></section><section class='card actions'><button id='prevMonth'>‹ Voriger Monat</button><button id='todayMonth'>Aktueller Monat</button><button id='nextMonth'>Nächster ›</button></section><section class='card'><h2>Daten</h2><div class='grid'><button id='csvBtn'>CSV exportieren</button><button id='backupBtn'>Backup exportieren</button><label class='button'>Backup importieren<input id='importFile' type='file' accept='.json,application/json' hidden></label></div></section></main>
<dialog id='txDialog'><form method='dialog' id='txForm'><h2>Neue Buchung</h2><label>Art<select id='type'><option value='expense'>Ausgabe</option><option value='income'>Einnahme</option></select></label><label>Betrag (€)<input id='amount' inputmode='decimal' required placeholder='0,00'></label><label>Kategorie<select id='category'></select></label><label>Datum<input id='date' type='date' required></label><label>Notiz<input id='note' placeholder='Optional'></label><div class='dialogActions'><button value='cancel'>Abbrechen</button><button id='saveTx' value='default'>Speichern</button></div></form></dialog>
<dialog id='recDialog'><form method='dialog' id='recForm'><h2>Monatliche Buchung</h2><label>Art<select id='rType'><option value='expense'>Ausgabe</option><option value='income'>Einnahme</option></select></label><label>Name<input id='rName' required placeholder='z. B. Miete'></label><label>Betrag (€)<input id='rAmount' inputmode='decimal' required></label><label>Kategorie<select id='rCategory'></select></label><label>Tag im Monat<input id='rDay' type='number' min='1' max='28' value='1'></label><div class='dialogActions'><button value='cancel'>Abbrechen</button><button id='saveRecurring' value='default'>Speichern</button></div></form></dialog>
<script src='app.js'></script></body></html>
